name: Publicar demo no GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Regera toda segunda-feira para as datas da massa fictícia acompanharem o calendário.
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - run: python scripts/build_demo.py _site
        env:
          TZ: America/Sao_Paulo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
