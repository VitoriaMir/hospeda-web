<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • {{ brand.name }}</title><link rel="icon" href="{{url_for('static',filename=brand.logo)}}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="{{url_for('static',filename='css/app.css')}}"></head><body class="login-page"><div class="login-card"><div class="brand login-brand"><img class="brand-mark" src="{{url_for('static',filename=brand.logo)}}" alt="{{ brand.name }}"><div><b>{{ brand.name }}</b><small>{{ brand.tagline }}</small></div></div><h1>Bem-vinda de volta</h1><p>Acesse o painel administrativo.</p>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>Usuário<input name="username" value="admin" required autofocus></label><label>Senha<input name="password" type="password" placeholder="Digite sua senha" required></label><button class="btn primary full">Entrar no {{ brand.name }}</button></form><div class="login-help">Sistema web • acesso seguro</div></div></body></html>
